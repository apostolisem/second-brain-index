<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#glow)"/>

  <!-- hub spokes -->
  <g stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="24" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="104"/>
    <line x1="256" y1="256" x2="400" y2="209"/>
    <line x1="256" y1="256" x2="345" y2="381"/>
    <line x1="256" y1="256" x2="167" y2="381"/>
    <line x1="256" y1="256" x2="112" y2="209"/>
  </g>

  <!-- satellite nodes -->
  <g fill="#FFFFFF">
    <circle cx="256" cy="104" r="44"/>
    <circle cx="400" cy="209" r="44"/>
    <circle cx="345" cy="381" r="44"/>
    <circle cx="167" cy="381" r="44"/>
    <circle cx="112" cy="209" r="44"/>
  </g>

  <!-- central hub -->
  <circle cx="256" cy="256" r="86" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="38" fill="#6D28D9"/>
</svg>
